[project]
name = "sakila-sql-agent"
version = "0.1.0"
description = "Text-to-SQL agent over Sakila: LangGraph loop with guardrails, self-repair and an execution-accuracy eval"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=0.2",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "eval"]

[tool.pytest.ini_options]
pythonpath = ["."]

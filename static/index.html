<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakila SQL Agent</title>
<style>
  :root {
    --paper: #f6f7f4; --card: #ffffff; --ink: #1b1f23; --muted: #6b7076; --line: #d9dcd6;
    --accent: #0b6e4f; --accent-soft: #e3f2ec; --bad: #b3261e; --bad-soft: #fbeae8; --focus: #2f6fed;
    --sans: system-ui, "Segoe UI", sans-serif; --mono: Consolas, "Cascadia Code", ui-monospace, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #131517; --card: #1c1f23; --ink: #e8e7e2; --muted: #9aa0a6; --line: #32363c;
            --accent: #4fc39a; --accent-soft: #14312a; --bad: #ef6a5f; --bad-soft: #3a1f1c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--sans); }
  main { max-width: 860px; margin: 0 auto; padding: 44px 20px 80px; }
  header { display: flex; align-items: baseline; gap: 14px; margin-bottom: 24px; }
  h1 { font: 600 22px/1 var(--sans); margin: 0; letter-spacing: -0.01em; }
  h1 span { color: var(--accent); }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  header a { color: var(--muted); }

  .field { position: relative; }
  textarea { width: 100%; min-height: 70px; padding: 13px 90px 13px 15px; resize: none; font: 16px/1.45 var(--sans);
             color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; outline: none; }
  textarea:focus { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
  #btn { position: absolute; right: 10px; bottom: 10px; padding: 8px 16px; font: 600 14px var(--sans); color: #fff;
         background: var(--accent); border: 0; border-radius: 7px; cursor: pointer; }
  #btn:disabled { opacity: .55; cursor: progress; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 2px 0; }
  .chips button { font: 13px var(--sans); color: var(--muted); background: transparent; border: 1px solid var(--line);
                  border-radius: 999px; padding: 4px 11px; cursor: pointer; }
  .chips button:hover { color: var(--ink); border-color: var(--muted); }

  #stream { margin-top: 32px; display: flex; flex-direction: column; gap: 32px; }
  .qa + .qa { opacity: .6; }
  .q { font: 500 14px var(--sans); color: var(--muted); margin: 0 0 10px; }
  .a { font-size: 17px; margin: 0 0 12px; }
  .a.err { color: var(--bad); }
  pre.sql { margin: 0; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 8px;
            font: 13px/1.5 var(--mono); white-space: pre-wrap; overflow-x: auto; }
  .meta { font: 12px var(--mono); color: var(--muted); margin: 8px 0 12px; display: flex; gap: 12px; align-items: center; }
  .meta button { font: 12px var(--mono); color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; cursor: pointer; }
  .meta button:disabled { color: var(--muted); cursor: default; }
  .wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
  table { border-collapse: collapse; font: 13px var(--sans); min-width: 100%; }
  th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font: 600 11px var(--mono); letter-spacing: .06em; color: var(--muted); text-transform: uppercase; }
  tr:last-child td { border-bottom: 0; }
  td.num { text-align: right; font-family: var(--mono); }
  details { margin-top: 10px; font-size: 13px; }
  summary { cursor: pointer; color: var(--muted); }
  .step { display: grid; grid-template-columns: 90px 1fr; gap: 10px; padding: 6px 0; border-top: 1px dashed var(--line); }
  .step b { font: 600 11px/1.6 var(--mono); letter-spacing: .06em; text-transform: uppercase; }
  .step.bad b { color: var(--bad); }
  .step.ok b { color: var(--accent); }
  .step pre { margin: 0; font: 12px/1.45 var(--mono); white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Sakila <span>SQL agent</span></h1>
    <p>Ask in plain language; the agent writes SQL, runs it read-only, and fixes its own mistakes. <a href="/schema">schema</a></p>
  </header>

  <form id="f">
    <div class="field">
      <textarea id="q" placeholder="Which customer has spent the most money?" required minlength="3" maxlength="500" rows="2"></textarea>
      <button id="btn" type="submit">Run</button>
    </div>
    <div class="chips" id="chips">
      <button type="button">Which actor has appeared in the most films?</button>
      <button type="button">How many rentals were made in May 2005?</button>
      <button type="button">En çok kiralanan 3 film hangileri?</button>
      <button type="button">Delete all customers</button>
    </div>
  </form>

  <section id="stream" aria-live="polite"></section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

$("chips").addEventListener("click", e => { if (e.target.tagName === "BUTTON") { $("q").value = e.target.textContent; $("f").requestSubmit(); } });
$("q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("f").requestSubmit(); } });

function table(cols, rows) {
  if (!cols.length) return "";
  const isNum = i => rows.every(r => r[i] === null || typeof r[i] === "number");
  return `<div class="wrap"><table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r => `<tr>${r.map((v, i) => `<td class="${isNum(i) ? "num" : ""}">${esc(v)}</td>`).join("")}</tr>`).join("")
  }</tbody></table></div>`;
}

function trace(steps) {
  return steps.map(s => {
    const bad = "error" in s, ok = s.step === "execute" && !bad;
    const body = s.sql ? `<pre>${esc(s.sql)}</pre>` : bad ? `<pre>${esc(s.error)}</pre>` : s.rows !== undefined ? `${s.rows} rows` : "";
    return `<div class="step ${bad ? "bad" : ok ? "ok" : ""}"><b>${esc(s.step)}</b><div>${body}</div></div>`;
  }).join("");
}

function render(question, b) {
  const failed = b.answer === null;
  return `<div class="qa">
    <p class="q">${esc(question)}</p>
    <p class="a ${failed ? "err" : ""}">${failed ? "Couldn't produce a working query: " + esc(b.error) : esc(b.answer)}</p>
    ${b.sql ? `<pre class="sql">${esc(b.sql)}</pre>` : ""}
    <p class="meta"><span>${b.latency_ms} ms · ${b.attempts} repair${b.attempts === 1 ? "" : "s"} · ${b.rows.length} row${b.rows.length === 1 ? "" : "s"}${b.truncated ? " (truncated)" : ""}</span>${
      failed ? "" : `<button type="button" class="approve" data-q="${esc(question)}" data-sql="${esc(b.sql)}" title="Remember this as a correct example">✓ correct</button>`}</p>
    ${table(b.columns, b.rows)}
    <details><summary>trace (${b.trace.length} steps)</summary>${trace(b.trace)}</details>
  </div>`;
}

$("stream").addEventListener("click", async e => {
  const btn = e.target.closest(".approve"); if (!btn) return;
  btn.disabled = true;
  const r = await fetch("/approve", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: btn.dataset.q, sql: btn.dataset.sql }) });
  btn.textContent = r.ok ? `saved · ${(await r.json()).bank_size} examples` : "couldn't save";
});

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const question = $("q").value.trim();
  $("btn").disabled = true;
  try {
    const r = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }) });
    const b = await r.json();
    if (!r.ok) throw new Error(b.detail || r.statusText);
    $("stream").insertAdjacentHTML("afterbegin", render(question, b));
    $("q").value = "";
  } catch (err) {
    $("stream").insertAdjacentHTML("afterbegin", `<div class="qa"><p class="q">${esc(question)}</p><p class="a err">${esc(err.message)}</p></div>`);
  } finally {
    $("btn").disabled = false; $("q").focus();
  }
});
</script>
</body>
</html>
